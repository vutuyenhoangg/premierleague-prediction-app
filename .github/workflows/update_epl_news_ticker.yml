name: Update EPL News Ticker

on:
  schedule:
    # 05:07 giờ Việt Nam
    # 22:07 UTC ngày hôm trước
    - cron: "7 22 * * *"

    # 13:07 giờ Việt Nam
    # 06:07 UTC cùng ngày
    - cron: "7 6 * * *"

  workflow_dispatch:
    inputs:
      edition:
        description: "Chọn bản tin muốn tạo"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon

permissions:
  contents: read

concurrency:
  group: epl-news-ticker
  cancel-in-progress: false

jobs:
  generate-news-ticker:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_NEWS_MODEL: gemini-2.5-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ticker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai sqlalchemy psycopg2-binary

      - name: Resolve ticker edition
        id: resolve-edition
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EDITION="${{ inputs.edition }}"

          elif [ "${{ github.event.schedule }}" = "7 22 * * *" ]; then
            EDITION="morning"

          else
            EDITION="afternoon"
          fi

          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "Selected edition: $EDITION"

      - name: Generate and publish ticker
        run: |
          python scripts/update_epl_news_ticker.py \
            --edition "${{ steps.resolve-edition.outputs.edition }}"
