name: Update EPL News Ticker

on:
  schedule:
    # 00:00 giờ Việt Nam
    # Tương ứng 17:00 UTC ngày hôm trước
    - cron: "0 17 * * *"

    # 14:00 giờ Việt Nam
    # Tương ứng 07:00 UTC cùng ngày
    - cron: "0 7 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epl-news-ticker
  cancel-in-progress: false

jobs:
  update-epl-news-ticker:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_NEWS_MODEL: gemini-3.6-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai sqlalchemy psycopg2-binary

      - name: Generate and publish latest EPL ticker
        run: |
          python scripts/update_epl_news_ticker.py
