name: Update EPL Data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-epl-data
  cancel-in-progress: false

jobs:
  update-epl-data:
    name: Crawl and sync EPL data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EPL_SOURCE_URL: https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/en.1.json
      EPL_SEASON_SLUG: 2025-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "SQLAlchemy>=2,<3" \
            psycopg2-binary \
            requests \
            urllib3

      - name: Validate Python syntax
        run: |
          python -m py_compile crawl_epl_data.py

      - name: Crawl OpenFootball and sync Supabase
        run: |
          python crawl_epl_data.py
