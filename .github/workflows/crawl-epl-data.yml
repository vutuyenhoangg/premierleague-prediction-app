name: Crawl EPL Data

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions uses UTC. This runs hourly at minute 10.
    - cron: "10 * * * *"

concurrency:
  group: crawl-epl-data
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl EPL data and match goals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EPL_SEASON_SLUG: "2025-26"
      EPL_SOURCE_URL: "https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/en.1.json"
      ESPN_SEASON_SEED_DATE: "20260524"
      RECENT_DAYS: "3"
      FORCE_REFRESH: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests sqlalchemy psycopg2-binary

      - name: Check required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Run EPL crawler
        run: python crawl_epl_data_combined.py
