name: Crawl EPL Data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. This runs hourly at minute 10.
    - cron: "10 * * * *"

concurrency:
  group: crawl-epl-data
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl EPL scores and scorers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sqlalchemy psycopg2-binary

      - name: Run EPL crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY || '123' }}
          THESPORTSDB_LEAGUE_ID: "4328"
          EPL_SEASON_SLUG: "2025-26"
          EPL_SOURCE_URL: "https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/en.1.json"
        run: python crawl_epl_data.py
