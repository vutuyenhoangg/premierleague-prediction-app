name: Test Supabase EPL Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-database:
    name: Test Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "SQLAlchemy>=2,<3" psycopg2-binary

      - name: Test DATABASE_URL
        shell: bash
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url


          database_url = os.getenv(
              "DATABASE_URL",
              "",
          ).strip()

          if not database_url:
              raise SystemExit(
                  "DATABASE_URL đang trống."
              )

          parsed = make_url(database_url)

          print("=" * 60)
          print("KIỂM TRA DATABASE_URL")
          print("=" * 60)
          print(
              "URL:",
              parsed.render_as_string(
                  hide_password=True
              ),
          )
          print("Driver:", parsed.drivername)
          print("Username:", parsed.username)
          print("Host:", parsed.host)
          print("Port:", parsed.port)
          print("Database:", parsed.database)

          if parsed.drivername != "postgresql+psycopg2":
              raise SystemExit(
                  "Driver phải là postgresql+psycopg2."
              )

          if parsed.port != 5432:
              raise SystemExit(
                  "Session Pooler phải dùng port 5432."
              )

          engine = create_engine(
              database_url,
              pool_pre_ping=True,
              pool_size=1,
              max_overflow=0,
              connect_args={
                  "connect_timeout": 20,
              },
          )

          try:
              with engine.connect() as connection:
                  info = connection.execute(
                      text(
                          """
                          SELECT
                              current_database() AS database_name,
                              current_user AS database_user,
                              NOW() AS server_time
                          """
                      )
                  ).mappings().one()

                  tables = connection.execute(
                      text(
                          """
                          SELECT table_name
                          FROM information_schema.tables
                          WHERE table_schema = 'public'
                          ORDER BY table_name
                          """
                      )
                  ).scalars().all()

                  print("\nPOSTGRESQL LOGIN OK")
                  print(
                      "Database:",
                      info["database_name"],
                  )
                  print(
                      "User:",
                      info["database_user"],
                  )
                  print(
                      "Server time:",
                      info["server_time"],
                  )

                  print("\nCÁC BẢNG PUBLIC:")

                  if tables:
                      for table_name in tables:
                          print(f"- {table_name}")
                  else:
                      print("- Chưa có bảng nào")

              print(
                  "\nDATABASE_URL HOẠT ĐỘNG HOÀN CHỈNH"
              )

          finally:
              engine.dispose()
          PY
