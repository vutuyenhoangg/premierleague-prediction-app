name: Diagnose Supabase EPL Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-database:
    name: Diagnose Supabase connection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "SQLAlchemy>=2,<3" psycopg2-binary

      - name: Diagnose Supabase connection
        shell: bash
        run: |
          python - <<'PY'
          import os
          import socket
          import sys

          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from sqlalchemy.exc import OperationalError


          database_url = os.getenv(
              "DATABASE_URL",
              "",
          ).strip()

          if not database_url:
              raise SystemExit(
                  "LỖI: GitHub Actions Secret DATABASE_URL đang trống."
              )

          try:
              parsed_url = make_url(database_url)
          except Exception as error:
              raise SystemExit(
                  f"LỖI: DATABASE_URL không parse được: "
                  f"{type(error).__name__}: {error}"
              ) from error

          safe_url = parsed_url.render_as_string(
              hide_password=True
          )

          host = parsed_url.host
          port = parsed_url.port
          username = parsed_url.username
          database_name = parsed_url.database
          driver = parsed_url.drivername

          print("=" * 70)
          print("THÔNG TIN KẾT NỐI ĐÃ CHE PASSWORD")
          print("=" * 70)
          print("URL:", safe_url)
          print("Driver:", driver)
          print("Username:", username)
          print("Host:", host)
          print("Port:", port)
          print("Database:", database_name)

          errors = []

          if driver != "postgresql+psycopg2":
              errors.append(
                  "Driver phải là postgresql+psycopg2"
              )

          if not username or not username.startswith(
              "postgres."
          ):
              errors.append(
                  "Username Session pooler phải có dạng "
                  "postgres.PROJECT_REF"
              )

          if not host or "pooler.supabase.com" not in host:
              errors.append(
                  "Host không phải Supabase pooler host"
              )

          if port != 5432:
              errors.append(
                  "Session pooler phải dùng port 5432"
              )

          if database_name != "postgres":
              errors.append(
                  "Database name phải là postgres"
              )

          if errors:
              print("\nCẤU TRÚC DATABASE_URL CÓ VẤN ĐỀ:")

              for error in errors:
                  print("-", error)

              raise SystemExit(1)

          print("\n[1/3] KIỂM TRA DNS")

          try:
              addresses = socket.getaddrinfo(
                  host,
                  port,
                  type=socket.SOCK_STREAM,
              )

              unique_addresses = sorted({
                  item[4][0]
                  for item in addresses
              })

              print("DNS OK")
              print(
                  "Địa chỉ tìm được:",
                  ", ".join(unique_addresses),
              )

          except socket.gaierror as error:
              print(
                  "DNS FAILED:",
                  repr(error),
                  file=sys.stderr,
              )

              raise SystemExit(1) from error

          print("\n[2/3] KIỂM TRA TCP PORT")

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=15,
              ):
                  print(
                      f"TCP OK: kết nối được tới "
                      f"{host}:{port}"
                  )

          except OSError as error:
              print(
                  "TCP FAILED:",
                  repr(error),
                  file=sys.stderr,
              )

              raise SystemExit(1) from error

          print("\n[3/3] KIỂM TRA ĐĂNG NHẬP POSTGRESQL")

          engine = create_engine(
              database_url,
              pool_pre_ping=True,
              pool_size=1,
              max_overflow=0,
              connect_args={
                  "connect_timeout": 15,
              },
          )

          try:
              with engine.connect() as connection:
                  result = connection.execute(
                      text(
                          """
                          SELECT
                              current_database() AS database_name,
                              current_user AS database_user,
                              NOW() AS server_time
                          """
                      )
                  ).mappings().one()

                  print("POSTGRESQL LOGIN OK")
                  print(
                      "Database:",
                      result["database_name"],
                  )
                  print(
                      "User:",
                      result["database_user"],
                  )
                  print(
                      "Server time:",
                      result["server_time"],
                  )

                  tables = connection.execute(
                      text(
                          """
                          SELECT table_name
                          FROM information_schema.tables
                          WHERE table_schema = 'public'
                          ORDER BY table_name
                          """
                      )
                  ).scalars().all()

                  print("\nCÁC BẢNG PUBLIC:")

                  if tables:
                      for table_name in tables:
                          print("-", table_name)
                  else:
                      print(
                          "- Chưa có bảng nào trong public"
                      )

              print("\nSUPABASE EPL CONNECTION SUCCESS")

          except OperationalError as error:
              print(
                  "\nPOSTGRESQL LOGIN FAILED",
                  file=sys.stderr,
              )

              print(
                  "Loại lỗi gốc:",
                  type(error.orig).__name__,
                  file=sys.stderr,
              )

              print(
                  "Chi tiết lỗi gốc:",
                  str(error.orig),
                  file=sys.stderr,
              )

              print(
                  "URL đã che password:",
                  safe_url,
                  file=sys.stderr,
              )

              raise SystemExit(1) from error

          except Exception as error:
              print(
                  "\nDATABASE QUERY FAILED",
                  file=sys.stderr,
              )

              print(
                  "Loại lỗi:",
                  type(error).__name__,
                  file=sys.stderr,
              )

              print(
                  "Chi tiết:",
                  str(error),
                  file=sys.stderr,
              )

              raise SystemExit(1) from error

          finally:
              engine.dispose()
          PY
